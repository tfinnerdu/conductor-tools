<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductor Companion{% block title_suffix %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>

<!-- Top brand bar -->
<div class="top-bar">
    <div>
        <span class="top-bar__title">Conductor Companion</span>
    </div>
    <div>
        <span class="top-bar__subtitle" id="conductor-url-display"></span>
    </div>
</div>

<!-- Navigation tabs -->
<div class="nav-tabs-wrapper">
    <ul class="nav-tabs">
        <li><a href="#search"     id="tab-search"     class="active">Search</a></li>
        <li><a href="#jq-lab"     id="tab-jq-lab"    >JQ Lab</a></li>
        <li><a href="#workers"    id="tab-workers"   >Workers</a></li>
        <li><a href="#migrations" id="tab-migrations">Migrations</a></li>
        <li><a href="#diff"       id="tab-diff"      >Diff</a></li>
        <li><a href="#traces"     id="tab-traces"    >Traces</a></li>
        <li><a href="#digest"     id="tab-digest"    >Digest</a></li>
    </ul>
</div>

<!-- Main content -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<!-- Scripts -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/jq_lab.js') }}"></script>
<script src="{{ url_for('static', filename='js/workers.js') }}"></script>
<script src="{{ url_for('static', filename='js/migrations.js') }}"></script>
<script src="{{ url_for('static', filename='js/diff.js') }}"></script>
<script>
    // Show server URL in top bar
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/health').then(r => r.json()).then(data => {
            const el = document.getElementById('conductor-url-display');
            if (el) el.textContent = 'v' + (data.version || '1.0.0');
        }).catch(() => {});
    });
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
