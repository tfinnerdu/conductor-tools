<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductor Companion{% block title_suffix %}{% endblock %}</title>

    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Doane brand tokens + Mission Control components + conductor overrides -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/doane.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mission-control.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />

    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ── Navbar ────────────────────────────────────────────────────────────── -->
<nav class="navbar doane-nav px-3" style="min-height:3.2rem">
    <a class="mc-brand py-2" href="/">
        <span class="doane-dot"></span>Conductor Companion
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
        <span id="mock-mode-chip" class="mc-mock-chip d-none">MOCK</span>
        <span id="version-badge" class="badge-slate" style="font-size:0.72rem;padding:0.3em 0.6em;border-radius:0.3rem;white-space:nowrap"></span>
    </div>
</nav>

<!-- ── Tab bar ───────────────────────────────────────────────────────────── -->
<div class="tab-bar">
    <div class="container-fluid px-2 d-flex flex-nowrap">
        <a href="#search"     id="tab-search"     class="tab-item"><i class="bi bi-search me-1"></i>Search</a>
        <a href="#jq-lab"     id="tab-jq-lab"     class="tab-item"><i class="bi bi-braces me-1"></i>JQ Lab</a>
        <a href="#workers"    id="tab-workers"    class="tab-item"><i class="bi bi-cpu me-1"></i>Workers</a>
        <a href="#migrations" id="tab-migrations" class="tab-item"><i class="bi bi-database-up me-1"></i>Migrations</a>
        <a href="#diff"       id="tab-diff"       class="tab-item"><i class="bi bi-arrow-left-right me-1"></i>Diff</a>
        <a href="#reconciler" id="tab-reconciler" class="tab-item"><i class="bi bi-arrow-repeat me-1"></i>Reconciler</a>
        <a href="#traces"     id="tab-traces"     class="tab-item"><i class="bi bi-diagram-3 me-1"></i>Traces</a>
        <a href="#digest"     id="tab-digest"     class="tab-item"><i class="bi bi-bar-chart me-1"></i>Digest</a>
        <a href="#settings"   id="tab-settings"   class="tab-item"><i class="bi bi-gear me-1"></i>Settings</a>
    </div>
</div>

<!-- ── Main content ──────────────────────────────────────────────────────── -->
<div class="container-fluid px-3 py-3">
    {% block content %}{% endblock %}
</div>

<!-- ── Toast container ───────────────────────────────────────────────────── -->
<div id="toast-container"
     aria-live="polite"
     aria-atomic="true"
     style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;"></div>

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App scripts -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/jq_lab.js') }}"></script>
<script src="{{ url_for('static', filename='js/workers.js') }}"></script>
<script src="{{ url_for('static', filename='js/migrations.js') }}"></script>
<script src="{{ url_for('static', filename='js/diff.js') }}"></script>
<script src="{{ url_for('static', filename='js/reconciler.js') }}"></script>
<script src="{{ url_for('static', filename='js/tracer.js') }}"></script>
<script src="{{ url_for('static', filename='js/digest.js') }}"></script>
<script src="{{ url_for('static', filename='js/test_harness.js') }}"></script>
<script src="{{ url_for('static', filename='js/secrets.js') }}"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Version badge from liveness endpoint
    fetch('/api/v1/health').then(r => r.json()).then(data => {
        const el = document.getElementById('version-badge');
        if (el) el.textContent = 'v' + (data.version || '1.0.0');
    }).catch(() => {});

    // Mock-mode chip from readiness endpoint
    fetch('/api/v1/health/deep').then(r => r.json()).then(data => {
        if (data.mock) {
            const chip = document.getElementById('mock-mode-chip');
            if (chip) chip.classList.remove('d-none');
        }
    }).catch(() => {});
});
</script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
